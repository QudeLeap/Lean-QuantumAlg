name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build all library modules with warnings as errors
        run: python3 .github/build-cache.py build --root .

      - name: Full custom lint
        run: lake lint

      - name: Package and verify the release build cache
        # The promotion tool commits public code as "Release X.Y.Z code".
        # Ordinary pull requests and maintenance pushes do not package caches.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        env:
          CACHE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 .github/build-cache.py pack --root .
          --output-dir "$RUNNER_TEMP/release-build-cache"
          --repository "$CACHE_REPOSITORY" --run-id "$GITHUB_RUN_ID"

      - name: Preserve the verified cache for this exact public commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/release-build-cache/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
