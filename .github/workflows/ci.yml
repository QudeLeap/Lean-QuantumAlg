name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    name: build
    # Selected release pushes are verified by Release CI after the draft is ready.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build all library modules with warnings as errors
        run: python3 .github/build-cache.py build --root .

      - name: Full custom lint
        run: lake lint

