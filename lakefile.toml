name = "QuantumAlg"
defaultTargets = ["QuantumAlg"]
lintDriver = "batteries/runLinter"
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false
weak.linter.unicodeLinter = false
# Implementation modules are intentionally private; the public surface is
# enforced by the repository's public-surface gate.
weak.linter.privateModule = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "QuantumAlg"
